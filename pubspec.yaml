name: roadix_mobile
description: "A real-time, location-aware roadside assistance and mechanic dispatch platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^11.2.0
  maplibre_gl: ^0.27.1
  geolocator: ^14.0.3
  path_provider: ^2.1.6
  supabase_flutter: ^2.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.8
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F8FAFC"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_foreground_inset: 25
