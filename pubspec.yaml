name: roadix_mobile
description: "A real-time, location-aware roadside assistance and mechanic dispatch platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  equatable: ^3.0.0
  maplibre_gl: ^0.27.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  dio: ^5.11.1
  supabase_flutter: ^2.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F8FAFC"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_foreground_inset: 25